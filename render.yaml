services:
  - type: web
    name: aushadhi-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TTS_API_KEY
        sync: false
      - key: FIREBASE_KEY_PATH
        value: firebase-key.json
